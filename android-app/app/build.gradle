plugins { id 'com.android.application' }

android {
    namespace 'cn.wzyp.view'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.wzyp.view'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0.0'
    }
    buildTypes {
        release {
            // First-install development key only: production signing must use a private keystore.
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
