plugins { id 'com.android.application' }

android {
    namespace 'cn.wzyp.view'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.wzyp.view'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '8.0.2'
    }
    signingConfigs {
        stableRelease {
            // Signing credentials only come from the CI secret store or the owner's local environment.
            // Never use a regenerated debug keystore for distributable builds.
            storeFile file(System.getenv('WZYP_SIGNING_KEYSTORE_PATH') ?: 'missing-release-signing-key.p12')
            storePassword System.getenv('WZYP_SIGNING_PASSWORD') ?: ''
            keyAlias 'wzyp_release'
            keyPassword System.getenv('WZYP_SIGNING_PASSWORD') ?: ''
            storeType 'PKCS12'
        }
    }
    buildTypes {
        debug {
            // Side-by-side emergency QA app; NEVER replace or delete a signed production install.
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            manifestPlaceholders = [appLabel: '链动小铺·修复测试版']
        }
        release {
            manifestPlaceholders = [appLabel: '链动小铺数据洞察']
            signingConfig signingConfigs.stableRelease
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
