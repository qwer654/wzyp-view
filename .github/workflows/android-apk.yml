name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'tools/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK Platform 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build bundled offline SQLite data
        run: python3 tools/build_offline_db.py
      - name: Bundle offline HTML interface
        run: python3 tools/build_offline_web.py
      - name: Enable configurable AI API interface
        run: python3 tools/enable_api_ui.py
      - name: Assemble debug APK
        run: gradle -p android-app --no-daemon --stacktrace assembleDebug
      - name: Verify APK and package
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          # Explicit network permission: only used by user-configured native AI API.
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -F 'android.permission.INTERNET'
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -F 'android.permission.ACCESS_NETWORK_STATE'; then
            echo "Unexpected network state permission" >&2
            exit 1
          fi
          unzip -l "$APK" | grep -q 'assets/seed.db'
          unzip -l "$APK" | grep -q 'assets/index.html'
          mkdir -p dist
          cp "$APK" dist/wzyp-view-android-v3.0.0-api-debug.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: wzyp-view-android-debug
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: android-build-${{ github.run_number }}
        shell: bash
        run: |
          gh release create "$TAG" dist/wzyp-view-android-v3.0.0-api-debug.apk dist/SHA256SUMS.txt \
            --title "Android v3.0.0 API · Build ${{ github.run_number }}" \
            --notes "Android 8.0+ 本地 SQLite 数据 + 用户自选 OpenAI 兼容 AI API。数据查询完全离线，AI API 需网络；密钥通过 Android Keystore 加密保存，可切换离线规则分析。调试签名不同可能需要备份并重装。"
