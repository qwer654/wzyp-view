name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'tools/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Load persistent release signing key
        shell: bash
        env:
          WZYP_SIGNING_KEYSTORE_B64: ${{ secrets.WZYP_SIGNING_KEYSTORE_B64 }}
          WZYP_SIGNING_PASSWORD: ${{ secrets.WZYP_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${WZYP_SIGNING_KEYSTORE_B64}" || -z "${WZYP_SIGNING_PASSWORD}" ]]; then
            echo "::error::Stable signing secrets missing. Read android-app/SIGNING.md; refusing to produce another incompatible APK."
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/wzyp-release.p12"
          printf '%s' "${WZYP_SIGNING_KEYSTORE_B64}" | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          test -s "${KEYSTORE_PATH}"
          echo "WZYP_SIGNING_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK Platform 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test incremental feed generator
        run: python3 -m unittest discover -s tests -p 'test_delta_feed.py' -v
      - name: Probe one public storefront page (non-blocking; no challenge bypass)
        continue-on-error: true
        run: python3 tools/probe_public_shop.py
      - name: Build bundled offline SQLite data
        run: python3 tools/build_offline_db.py
      - name: Bundle offline HTML interface
        run: python3 tools/build_offline_web.py
      - name: Enable configurable AI API interface
        run: python3 tools/enable_api_ui.py
      - name: Enable database update panel
        run: python3 tools/enable_db_update_ui.py
      - name: Enable incremental background sync UI
        run: python3 tools/enable_delta_sync_ui.py
      - name: Add public shop refresh UI
        run: python3 tools/enable_public_shop_ui.py
      - name: Assemble persistently signed release APK
        env:
          WZYP_SIGNING_PASSWORD: ${{ secrets.WZYP_SIGNING_PASSWORD }}
        run: gradle -p android-app --no-daemon --stacktrace assembleRelease
      - name: Verify APK and package
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          # Verify this is the upgradeable main application, not the separate QA build.
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='cn.wzyp.view' versionCode='10' versionName='8.0.2'"
          # Reject a misconfigured/replaced key before publishing a non-upgradeable APK.
          ACTUAL_FINGERPRINT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" \
            | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -n1 \
            | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ "$ACTUAL_FINGERPRINT" != "d1547a5aaea202c1811b47590bf8d6cc8a5dfaa7de0b79a29878c470d4914be8" ]]; then
            echo "::error::Signing certificate fingerprint mismatch; refusing to publish."
            exit 1
          fi
          echo "Verified stable signer: $ACTUAL_FINGERPRINT"
          # INTERNET: online AI and public data fetch; ACCESS_NETWORK_STATE is
          # REQUIRED by JobScheduler for NETWORK_TYPE_ANY/NETWORK_TYPE_UNMETERED.
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -F "android.permission.INTERNET"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -F "android.permission.ACCESS_NETWORK_STATE"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -F '.PublicRefreshJob'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -F '.DeltaSyncJob'
          unzip -l "$APK" | grep -q 'assets/seed.db'
          unzip -l "$APK" | grep -q 'assets/index.html'
          mkdir -p dist
          cp "$APK" dist/wzyp-view-android-v8.0.2-data-sync-fix-stable.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: wzyp-view-android-stable-release
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: android-build-${{ github.run_number }}
        shell: bash
        run: |
          gh release create "$TAG" dist/wzyp-view-android-v8.0.2-data-sync-fix-stable.apk dist/SHA256SUMS.txt \
            --title "Android v8.0.2 Reliable Data Sync Hotfix · Build ${{ github.run_number }}" \
            --notes "Android v8.0.2 shares one SQLite backend for all jobs, supports cancellation and safe SQLite export, fixes data sync UI and retains JobScheduler ACCESS_NETWORK_STATE; pinned stable release signature to SHA256 d1547a5aaea202c1811b47590bf8d6cc8a5dfaa7de0b79a29878c470d4914be8. Keeps v7 sync optimization, offline SQLite, AI API and optional background checks. v1-v7 CI-debug-signed APKs cannot be upgraded in place without the original private key. Back up, uninstall old, install this one ONCE; future signed releases can upgrade normally."
